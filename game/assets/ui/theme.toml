# Last Beacon's UI design tokens.
#
# This is the single source of truth for the reusable widget library's
# colors, spacing, and typography -- analogous to a CSS stylesheet. Widgets
# are authored against the token names in `foundation_runtime_library::ui_theme`
# (e.g. `UiColorToken::Accent`, `UiSpaceToken::Md`), and this file supplies
# the concrete values those tokens resolve to for Last Beacon specifically.
# A different game built on Foundation can ship its own `theme.toml` with
# entirely different values and reuse the same widgets unmodified.
#
# Changes here require a game restart to take effect (no live hot-reload).

[colors]
