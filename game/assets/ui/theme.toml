surface          = { r = 0.118, g = 0.161, b = 0.231, a = 1.0 }
surface_strong   = { r = 0.2,   g = 0.255, b = 0.333, a = 1.0 }
border           = { r = 0.278, g = 0.333, b = 0.412, a = 1.0 }
